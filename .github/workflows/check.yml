name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: runner.os == 'macOS'
        run: brew install coreutils
      - run: node --test tests/*.test.js
        working-directory: project
      - uses: actions/checkout@v7
        with:
          repository: omacom/omarchy
          ref: v4.5.0
          path: omarchy
          sparse-checkout: bin/omarchy-plugin-validate
          sparse-checkout-cone-mode: false
      - run: bash omarchy/bin/omarchy-plugin-validate project
      - run: bash -n scripts/prepare-state && bash -n scripts/read-clipboard && python3 -m py_compile scripts/*.py
        working-directory: project
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test
        working-directory: macos
      - run: ./build-app.sh
        working-directory: macos
