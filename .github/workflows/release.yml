name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build-app.sh --dmg
        working-directory: macos
      - uses: actions/upload-artifact@v7
        with:
          name: omoji
          path: macos/build/omoji.dmg
          if-no-files-found: error
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(jq -r .version manifest.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: omoji
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" omoji.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" omoji.dmg --verify-tag --generate-notes
          fi
